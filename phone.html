<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRCSmartphoneSender</title>
<!-- スマートフォンで読みやすく、片手でも操作しやすい縦長レイアウト。 -->
<style>*{box-sizing:border-box}body{margin:0;background:#eef8fc;color:#183b50;font-family:system-ui,sans-serif}main{max-width:560px;margin:auto;padding:24px 18px}h1{font-size:28px;margin-bottom:4px}p{line-height:1.6}textarea{width:100%;height:220px;border:1px solid #a3cddd;border-radius:16px;padding:16px;font:18px system-ui;background:white}button{border:0;border-radius:12px;padding:16px;font:600 16px system-ui;cursor:pointer;background:#fff;color:#164f70}button:disabled{opacity:.5}.checks{display:grid;gap:8px;margin:14px 0 12px}.checks label{display:flex;align-items:center;gap:10px;margin:0;background:#fff;border:1px solid #a3cddd;border-radius:12px;padding:14px}#send{width:100%;background:#2183bb;color:#fff;margin-bottom:8px}.meta{display:flex;justify-content:space-between;font-size:14px;margin-top:8px}#status{min-height:48px;white-space:pre-wrap}section{margin-top:25px}section button{margin:4px;padding:10px}.error{color:#b4354a}label{display:block;margin:14px 0}small{color:#526c7c}</style>
<!-- 入力欄、送信設定、定型文、今回の履歴を1画面にまとめる。 -->
<main><h1>VRCSmartphoneSender</h1><p>スマホからVRChatへ送信。</p><textarea id="text" placeholder="ここに文章を入力…"></textarea><div class="meta"><span id="count">0 / 144文字</span><button id="clear" style="padding:4px 12px">入力を消す</button></div><label><input id="sound" type="checkbox"> VRChatの送信通知音を鳴らす</label><div class="checks"><label><input id="to-chat" type="checkbox" checked> チャットボックスに送信</label><label><input id="to-clip" type="checkbox"> クリップボードに送信</label></div><button id="send">送信</button><p id="status" role="status"></p><small>PCコピーは144文字を超えても使えます。VRChatは最大9行（折り返しを含む）。自動送信はしません。</small><section><b>定型文（タップして入力）</b><div id="presets"></div></section><section><b>今回の送信履歴（タップして再入力）</b><div id="history"></div><small>履歴はこの画面を閉じると消えます。</small></section></main>
<script>
const field = document.querySelector('#text');
const statusEl = document.querySelector('#status');
const count = document.querySelector('#count');

// QRコードのURLに含まれる接続キーを、タブを閉じるまでsessionStorageへ保持する。
// 保存後はアドレス欄からキーを消し、画面共有などで不用意に見えないようにする。
const key = location.hash.slice(1);
if (key) {
  sessionStorage.setItem('pairKey', key);
  history.replaceState(null, '', location.pathname);
}
const token = sessionStorage.getItem('pairKey') || '';
if (!token) {
  statusEl.textContent = 'PCのQRコードから開いてください。';
  statusEl.className = 'error';
}

// 入力文字数を表示する。144文字超過時は警告色にするが、
// クリップボードだけへ送る場合は長文も許可されるため入力自体は止めない。
function update() {
  count.textContent = field.value.length + ' / 144文字';
  count.className = field.value.length > 144 ? 'error' : '';
}
field.addEventListener('input', update);
document.querySelector('#clear').onclick = () => {
  field.value = '';
  update();
  field.focus();
};

// 定型文と履歴に共通で使う、タップ可能な文章ボタンを作る。
function chip(parent, text) {
  const button = document.createElement('button');
  button.textContent = text;
  button.onclick = () => {
    field.value = text;
    update();
    field.focus();
  };
  parent.append(button);
}

// PC側のpresets.txtを読み込み、1行につき1個の定型文ボタンを作る。
// ファイルを編集した場合は、PCアプリの再起動後にこの画面を開き直すと反映される。
async function loadPresets() {
  const box = document.querySelector('#presets');
  try {
    const response = await fetch('/presets', {cache: 'no-store'});
    if (!response.ok) throw Error('定型文を取得できませんでした');
    const presets = await response.json();
    presets.forEach(text => chip(box, text));
  } catch (error) {
    const note = document.createElement('small');
    note.className = 'error';
    note.textContent = error.message;
    box.append(note);
  }
}
loadPresets();

const chatBox = document.querySelector('#to-chat');
const clipBox = document.querySelector('#to-clip');
const sendBtn = document.querySelector('#send');

// 2個のチェックボックスを、サーバーが受け取るmode文字列へ変換する。
function destination() {
  if (chatBox.checked && clipBox.checked) return 'both';
  if (chatBox.checked) return 'chat';
  if (clipBox.checked) return 'clipboard';
  return '';
}

// 送信先が1つもない場合は、誤操作を防ぐため送信ボタンを無効にする。
function syncSend() {
  sendBtn.disabled = !destination();
}
chatBox.onchange = clipBox.onchange = syncSend;

let busy = false;
sendBtn.onclick = async () => {
  const mode = destination();
  if (!mode) {
    statusEl.className = 'error';
    statusEl.textContent = '送信先を1つ以上選んでください。';
    return;
  }

  // 連打による二重送信を防ぎ、処理完了まで送信設定も固定する。
  if (busy) return;
  busy = true;
  sendBtn.disabled = chatBox.disabled = clipBox.disabled = true;
  statusEl.className = '';
  statusEl.textContent = '送信中…';
  const text = field.value;

  try {
    // 接続キーは専用ヘッダーへ入れ、10秒応答がなければタイムアウトする。
    const response = await fetch('/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Pair-Key': token},
      body: JSON.stringify({
        text,
        mode,
        sound: document.querySelector('#sound').checked
      }),
      signal: AbortSignal.timeout(10000)
    });
    const result = await response.json();
    if (!response.ok) throw Error(result.error || '送信できませんでした');

    statusEl.textContent = result.message;
    // 履歴は端末へ永続保存せず、このページ内だけで最大10件保持する。
    const box = document.querySelector('#history');
    chip(box, text);
    while (box.children.length > 10) box.firstChild.remove();
  } catch (error) {
    statusEl.className = 'error';
    statusEl.textContent = error.name === 'TimeoutError'
      ? '応答がありません。送信済みの場合もあるのでPCとVRChatを確認してください。'
      : error.message;
  } finally {
    busy = false;
    chatBox.disabled = clipBox.disabled = false;
    syncSend();
  }
};
</script></html>
